<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMAS — Portal Game Edukasi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #fef3c7 0%, #dbeafe 55%, #dcfce7 100%); min-height: 100vh; color: #1e293b; }
  header { text-align: center; padding: 48px 20px 12px; }
  header .badge { display: inline-block; background: #f59e0b; color: #fff; font-weight: 700; padding: 6px 16px; border-radius: 999px; font-size: 14px; letter-spacing: 1px; }
  header h1 { font-size: 52px; margin: 14px 0 8px; color: #b45309; }
  header p { font-size: 18px; color: #475569; max-width: 560px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; max-width: 1024px; margin: 36px auto; padding: 0 20px 48px; }
  .card { background: #fff; border-radius: 20px; padding: 26px 22px; box-shadow: 0 8px 24px rgba(15,23,42,.10); border: 3px solid #fde68a; display: flex; flex-direction: column; gap: 8px; }
  .card .icon { font-size: 46px; }
  .card h2 { font-size: 24px; color: #92400e; }
  .card .meta { color: #64748b; font-size: 15px; line-height: 1.5; }
  .card a.play { margin-top: 14px; text-align: center; background: #16a34a; color: #fff; text-decoration: none; font-weight: 700; font-size: 17px; padding: 12px; border-radius: 12px; }
  .card a.play:hover { background: #15803d; }
  footer { text-align: center; padding: 0 20px 36px; color: #94a3b8; font-size: 14px; }
</style>
</head>
<body>
  <header>
    <span class="badge">PORTAL GAME EDUKASI</span>
    <h1>🎮 GEMAS</h1>
    <p>Kumpulan game pembelajaran karya guru-guru. Pilih kartu game-nya, klik Main, langsung bermain!</p>
  </header>

  <main class="grid">
    <!-- Kartu game: tambahkan kartu baru di bawah ini untuk setiap game baru -->
    <article class="card">
      <div class="icon">🎋</div>
      <h2>Panjat Pinang</h2>
      <p class="meta">
        👩‍🏫 Guru: Oka Melya, S.Pd.<br>
        🏫 Kelas 3<br>
        📚 Matematika
      </p>
      <a class="play" href="games/panjat-pinang/">▶ Main Sekarang</a>
    </article>
  </main>

  <footer>GEMAS — Portal Game Edukasi • Dibuat oleh guru-guru, untuk siswa-siswi tercinta.</footer>
</body>
</html>
